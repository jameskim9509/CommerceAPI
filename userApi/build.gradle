plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.0'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'org.asciidoctor.jvm.convert' version '3.3.2'
}

version '0.1'

apply from: rootProject.file('shared.gradle')

ext {
    set('springCloudVersion', '2023.0.2')
    set('snippetsDir', file("${buildDir}/generated-snippets"))
}

configurations {
    asciidoctorExt
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

dependencies {
    // ADR-005: Eureka 클라이언트 등록
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'

    //Jpa
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.data:spring-data-envers'

    //Database
    implementation 'com.mysql:mysql-connector-j'

    //Flyway
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'

    //Kafka (ADR-003: Choreography SAGA)
    implementation 'org.springframework.kafka:spring-kafka'

    implementation 'org.apache.commons:commons-lang3:3.12.0'

    implementation 'org.springframework.boot:spring-boot-starter-web'

    // ADR-007: Gmail SMTP 이메일 발송 (JavaMailSender)
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    //security
    implementation 'org.springframework.boot:spring-boot-starter-security'

    //jwt
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    // Spring REST Docs : AsciiDoctor 확장 (operation 매크로)
    asciidoctorExt 'org.springframework.restdocs:spring-restdocs-asciidoctor'
}

test {
    outputs.dir snippetsDir
}

asciidoctor {
    configurations 'asciidoctorExt'
    // 스니펫은 test 산출물이다. `-x test` 로 빌드하면(CLAUDE.md 의 로컬 편의 빌드)
    // generated-snippets 가 없으므로 optional 로 두어 입력 검증 실패를 막고,
    // onlyIf 로 문서 생성 자체를 건너뛴다. index.adoc 이 operation:: 매크로로
    // 스니펫을 참조하므로 테스트 없이 만든 문서는 어차피 의미가 없다.
    inputs.dir(snippetsDir).optional()
    onlyIf { snippetsDir.exists() }
    dependsOn test
    baseDirFollowsSourceFile()
}

bootJar {
    dependsOn asciidoctor
    from("${asciidoctor.outputDir}") {
        into 'static/docs'
    }
}

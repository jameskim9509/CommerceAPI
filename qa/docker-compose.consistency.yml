# =============================================================================
# 정합성 통합 시나리오 override (base: docker-compose.qa.yml)
#
# Kafka 자동 생성 토픽의 파티션 수를 4 로 늘려, payment-deducted 를 4 개
# orderApi 인스턴스가 병렬 소비하도록 한다. 같은 한정 SKU 의 재고 차감이
# 병렬로 일어나야 ADR-002 의 낙관적 락 충돌이 실제로 발화한다.
#
# 사용:
#   docker compose -f qa/docker-compose.qa.yml -f qa/docker-compose.consistency.yml \
#       up -d --scale orderapi=4 mysql-user mysql-order redis kafka eureka userapi orderapi gateway
# =============================================================================
services:
  kafka:
    environment:
      KAFKA_CFG_NUM_PARTITIONS: "4"

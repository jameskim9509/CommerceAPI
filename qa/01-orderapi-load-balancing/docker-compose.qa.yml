# =============================================================================
# ADR-005 시나리오 3 QA 측정 환경
#
# docker-compose.test.yml 와 분리한 이유:
#   - 측정 전용 자원 한도 (인스턴스당 2 CPU / 1 GB) → 4 인스턴스 동시 띄우기 가능
#   - 시드는 db-seed 서비스가 자동 주입하거나, 수동 측정 절차에서 docker exec 로 직접 주입
#   - k6 컨테이너 추가 + ./k6 / ./results 볼륨 마운트
#
# 사용:
#   docker compose -f qa/01-orderapi-load-balancing/docker-compose.qa.yml up -d                 # 기본 (orderapi 1 개)
#   ORDERAPI_REPLICAS=4 docker compose -f qa/01-orderapi-load-balancing/docker-compose.qa.yml up -d   # orderapi 4 개 (deploy.replicas)
#   docker compose -f qa/01-orderapi-load-balancing/docker-compose.qa.yml down -v               # 정리 (볼륨 포함)
#
# ★ name: qa-orderapi-load-balancing — 시나리오별 고유 프로젝트명 (형제 시나리오 qa-consist 와 대칭).
#   컨테이너명이 qa-orderapi-load-balancing-* 로 고정돼 monitor-stats.sh 의 접두사/
#   `qa-orderapi-load-balancing-mysql-order-1` 하드코딩이 동작한다 (폴더명이 프로젝트명이 되는 기본 동작 무력화).
# =============================================================================

name: qa-orderapi-load-balancing

services:
  mysql-user:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: user
      MYSQL_USER: commerce
      MYSQL_PASSWORD: commerce
    ports:
      - "3306:3306"
    volumes:
      - mysql-user-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pcommerce"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [commerce]

  mysql-order:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: orders
      MYSQL_USER: commerce
      MYSQL_PASSWORD: commerce
    ports:
      - "3307:3306"
    volumes:
      - mysql-order-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pcommerce"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [commerce]

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [commerce]

  kafka:
    image: bitnamilegacy/kafka:3.7  # bitnami 가 namespace 를 옮겨 기존 태그는 docker.io 에서 사라짐
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [commerce]

  eureka:
    build:
      context: ../../eurekaServer
      dockerfile: Dockerfile
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8761/ > /dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    networks: [commerce]

  userapi:
    build:
      context: ../../userApi
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: test
      MYSQL_HOST: mysql-user
      MYSQL_PORT: 3306
      MYSQL_DATABASE: user
      MYSQL_USER: commerce
      MYSQL_PASSWORD: commerce
      MAIL_USERNAME: dummy@example.com
      MAIL_PASSWORD: dummy-password
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_SERVER_URL: http://eureka:8761/eureka/
    ports:
      - "8081:8080"
    depends_on:
      mysql-user: { condition: service_healthy }
      kafka: { condition: service_healthy }
      eureka: { condition: service_healthy }
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
    networks: [commerce]

  # ADR-005 측정 대상. deploy.replicas=${ORDERAPI_REPLICAS:-1} 로 N 인스턴스 기동 (env 로 조절).
  orderapi:
    build:
      context: ../../orderApi
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: test
      MYSQL_HOST: mysql-order
      MYSQL_PORT: 3306
      MYSQL_DATABASE: orders
      MYSQL_USER: commerce
      MYSQL_PASSWORD: commerce
      REDIS_HOST: redis
      REDIS_PORT: 6379
      USER_API_URL: http://gateway/user/customer
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_SERVER_URL: http://eureka:8761/eureka/
      # application-test.yml 은 show-sql/format_sql 이 true 인데 운영(application-prod.yml)은
      # 둘 다 false 다. 그대로 두면 운영과 다른 설정을 측정하게 된다. 부하 중 포맷된 SQL 이
      # 인스턴스당 초당 2 만 줄 규모로 stdout 에 쏟아져(Hibernate 포매터 + Logback + docker
      # json-file 삼중 비용) 측정을 오염시킨다. 기본을 운영과 맞추고 필요 시 SHOW_SQL=true 로 켠다.
      SPRING_JPA_SHOW_SQL: ${SHOW_SQL:-false}
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: ${SHOW_SQL:-false}
      # HikariCP 최대 풀 크기. 앱에 설정이 없어 Spring Boot 기본값 10 이 적용된다.
      # 500 VU / 4 인스턴스면 인스턴스당 동시 요청 125 개가 커넥션 10 개를 두고 대기한다.
      # 주문 1 건이 쿼리 16 개를 트랜잭션 안에서 처리하며 그 동안 커넥션을 점유하므로,
      # MySQL 쪽 threads_running 이 낮아도(41 개 중 18.7) 앱 쪽 풀은 마를 수 있다.
      # threads_connected = POOL x 인스턴스수 + 1 로 적용 여부를 확인한다.
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${HIKARI_POOL:-10}
    depends_on:
      mysql-order: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
      eureka: { condition: service_healthy }
    # CPU 한도를 cpus 대신 cpu_period/cpu_quota 로 표현한다 (N CPU = quota / period).
    #   기본 200000/100000 = 2 CPU — 기존 cpus:'2' 와 동일.
    # 주기를 줄이면 총량(듀티 사이클)은 그대로면서 스로틀 1 회당 정지 시간이 짧아진다.
    # cgroup 은 주기마다 할당량을 강제하므로, 스레드가 많으면 큰 할당량도 주기 초반에
    # 태우고 남은 시간을 통째로 멈춘다 (실측: orderapi 가 주기의 7~10.5% 에서 스로틀).
    # 총 CPU 를 늘리면 중앙값이, 주기를 줄이면 꼬리(p95/p99)가 개선될 것으로 예상된다.
    #   예: CPU_PERIOD=20000 ORDERAPI_QUOTA=40000 → 2 CPU 유지, 주기 20ms
    cpu_period: ${CPU_PERIOD:-100000}
    cpu_quota: ${ORDERAPI_QUOTA:-200000}
    deploy:
      replicas: ${ORDERAPI_REPLICAS:-1}   # 실험마다 export ORDERAPI_REPLICAS=N (기본 1). --scale 대신 env 주입.
      resources:
        limits:
          memory: 1G
    networks: [commerce]

  gateway:
    build:
      context: ../../gateway
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: test
      EUREKA_SERVER_URL: http://eureka:8761/eureka/
    ports:
      - "8080:80"
    depends_on:
      eureka: { condition: service_healthy }
      userapi: { condition: service_started }
      orderapi: { condition: service_started }
    # 기본 100000/100000 = 1 CPU. 4 인스턴스 측정에서 gateway 가 주기의 15.2% 에서
    # 스로틀돼 (orderapi 7~10.5% 보다 잦다) 실질 제약으로 확인됐다.
    # 자원을 늘리려면 GATEWAY_QUOTA, 고르게 쓰려면 CPU_PERIOD 를 조절한다.
    #   예: CPU_PERIOD=20000 GATEWAY_QUOTA=20000 → 1 CPU 유지, 주기 20ms
    cpu_period: ${CPU_PERIOD:-100000}
    cpu_quota: ${GATEWAY_QUOTA:-100000}
    deploy:
      resources:
        limits:
          memory: 768M
    networks: [commerce]

  # 시나리오 자립 시드 자동 주입 (1회용). 이 시드가 자기 seller + 부하 더미를 모두 만든다.
  #   스키마는 Flyway(앱 부팅 시)가 만들므로 테이블이 생길 때까지 폴링 후 시나리오 seed 주입.
  #   수동 측정 절차도 up 서비스 목록에 db-seed 를 포함해 자동 주입 (docker compose wait db-seed 로 완료 대기).
  #   직접 `docker compose -f qa/01-orderapi-load-balancing/docker-compose.qa.yml up -d` 하면 시나리오 seed 가 자동 주입된다.
  db-seed:
    image: mysql:8.0
    restart: "no"
    depends_on:
      mysql-user:
        condition: service_healthy
      mysql-order:
        condition: service_healthy
      userapi:
        condition: service_started
      orderapi:
        condition: service_started
    volumes:
      - ./seed:/seed:ro
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        echo "[db-seed] waiting for Flyway-created tables ..."
        # 시드가 건드리는 테이블을 "전부" 기다린다. 일부만 기다리면 Flyway 가 나머지를
        # 만들기 전에 시드가 시작되는 레이스가 난다 (실제로 order.sql:20 의
        # DELETE FROM outbox_events 가 'Table doesn't exist' 로 실패해 exit 1 이 됐다).
        # 그 경우 user.sql 만 반영돼 로그인은 되지만 상품이 없어 cart_add 가 전건 실패한다.
        until mysql -h mysql-user  -uroot -proot user -e \
            'SELECT 1 FROM customer LIMIT 1; SELECT 1 FROM customer_roles LIMIT 1;
             SELECT 1 FROM customer_balance_history LIMIT 1; SELECT 1 FROM seller LIMIT 1;
             SELECT 1 FROM seller_roles LIMIT 1' >/dev/null 2>&1; do sleep 3; done
        until mysql -h mysql-order -uroot -proot orders -e \
            'SELECT 1 FROM product LIMIT 1; SELECT 1 FROM product_item LIMIT 1;
             SELECT 1 FROM orders LIMIT 1; SELECT 1 FROM order_items LIMIT 1;
             SELECT 1 FROM outbox_events LIMIT 1; SELECT 1 FROM processed_events LIMIT 1' >/dev/null 2>&1; do sleep 3; done
        echo "[db-seed] seeding scenario self-contained fixtures ..."
        mysql -h mysql-user  -uroot -proot user   < /seed/user.sql
        mysql -h mysql-order -uroot -proot orders < /seed/order.sql
        echo "[db-seed] done."
    networks: [commerce]

  # k6 부하 발생기. 각 실험마다 별도로 실행: docker compose run k6
  k6:
    image: grafana/k6:0.51.0
    volumes:
      - ./k6:/scripts:ro
      - ./results:/results
    environment:
      GATEWAY_URL: http://gateway
      VUS: ${VUS:-500}
      USER_COUNT: ${USER_COUNT:-500}
      EXECUTOR: ${EXECUTOR:-constant-vus}   # constant-vus | shared-iterations
      DURATION: ${DURATION:-5m}             # constant-vus 용 — 부하 지속 시간 (주문 수는 결과값)
      ORDER_COUNT: ${ORDER_COUNT:-50000}    # shared-iterations 용 — 총 주문 수 (런 시간은 결과값)
      MAX_DURATION: ${MAX_DURATION:-30m}    # shared-iterations 안전 상한
      PRODUCT_ITEM_COUNT: ${PRODUCT_ITEM_COUNT:-500}
      EXPERIMENT_LABEL: ${EXPERIMENT_LABEL:-unknown}
    depends_on:
      gateway: { condition: service_started }
    networks: [commerce]
    # k6 run 은 수동 측정 절차에서 docker compose run --rm k6 로 직접 호출 (ORDERAPI_REPLICAS export 유지)

networks:
  commerce:
    driver: bridge

volumes:
  mysql-user-data:
  mysql-order-data:

# =============================================================================
# ADR-008 주문 정합성 통합 시나리오 — treatment(현재/방어 ON) 측정 스택
#
# 01-load-balancing/docker-compose.qa.yml 와 같은 자립형 패턴이되 정합성 시나리오에 맞춤:
#   - name: consist   → 컨테이너 consist-*  (01-load-balancing 의 qa-* 와 네임스페이스 분리; 한 번에 하나만 기동)
#   - kafka KAFKA_CFG_NUM_PARTITIONS: 4 → orderApi 4인스턴스 × 4파티션 병렬 소비로 ② 재고·④ 잔액 @Version 경합 발화
#   - redis / kafka 볼륨 없음(ephemeral) → 주변 장애 T3(멱등키 유실)·T4(kafka 로그 전소) 카오스 주입 대상
#
# control(무방어) 실행은 무방어 브랜치(control/no-defense) 체크아웃 후 재빌드(compose build)로 한다 (방어 5종 OFF; 오버레이 없음).
#   ★ 태그 v1/v2 가 아니라 브랜치 tip 을 쓴다 — 두 태그는 control/no-defense 의 조상이라 앱 코드는 같지만
#     하네스가 구버전이고(verify 출력 토큰 상이, run-batch.sh 부재) README 절차와 맞지 않는다.
#
# -----------------------------------------------------------------------------
# ★ DB_CONN_TIMEOUT_MS (기본 1000) — T2(이벤트 드롭)를 "재현"시키기 위한 QA 전용 값
#
#   T2 = mysql-order stop(T2_DOWN_S=10s). 이 결함은 Kafka CommonErrorHandler/DLT 가 없어
#   기본 DefaultErrorHandler(FixedBackOff(0L, 9) = 지연 없이 총 10회 시도)가 재시도를 소진한 뒤
#   log-and-commit 으로 이벤트를 "드롭"하는 것이다. 즉 드롭이 나려면
#   리스너가 DB 불가 구간 안에서 10회 시도를 전부 태워야 한다.
#
#   1회 시도의 소요 = 커넥션 획득 블로킹 = HikariCP connectionTimeout.
#     재시도 창 ≈ 10 × connectionTimeout  <  실제 DB 불가 시간(≈21s: stop 10s + 컨테이너
#     재기동·mysqld 크래시 리커버리로 실제 접속 불가가 더 길게 이어진다)
#   ┌ connectionTimeout 30000ms(HikariCP 기본, 무설정) → 재시도 창 300s ≫ 21s.
#   │   DB 가 돌아올 때까지 첫 시도가 그대로 대기했다 성공한다 → 예외 자체가 안 난다
#   │   → DefaultErrorHandler 가 개입할 일이 없다 → 재시도도 드롭도 0. (실측: T-noT4 런의 v3a=0)
#   └ connectionTimeout 1000ms → 재시도 창 ≈10s < 21s → 10회 소진 후 드롭 발생 = T2 재현.
#
#   f426df4("카오스 앵커를 시간 기반으로 전환")는 정반대 방향으로 튜닝했다: T2_DOWN_S 를 25→10s 로
#   낮춰 "DB 불가 시간(≈21s)을 connectionTimeout(30s) 안쪽에 넣어" Hikari 타임아웃 0건을 만들었다.
#   그때의 목표는 대기 요청 몰살(실측 530건)을 막아 부하 예산을 지키는 것이었으나, 그 결과
#   T2 결함이 통째로 잠들어 버렸다. 여기서는 T2_DOWN_S 를 되돌리는 대신 connectionTimeout 을 낮춰
#   부하 예산은 유지한 채 재시도 창만 불가 구간 안으로 집어넣는다.
#
#   ★ HikariCP 하한 250ms: HikariConfig.setConnectionTimeout 이 250 미만이면 IllegalArgumentException
#     (→ Spring 바인딩 실패 → 앱 기동 불가)이고, validateNumerics() 는 30000ms 로 되돌려 버린다.
#     또 0 은 "즉시 실패"가 아니라 Integer.MAX_VALUE(사실상 무한 대기)다. 반드시 250 이상을 줄 것.
#
#   ★ 문서화되지 않으면 위험한 부작용 — JDBC 로그인 타임아웃 동반 하향:
#     PoolBase.setLoginTimeout 은 dataSource.setLoginTimeout(max(1, (500 + connectionTimeout)/1000 초)) 를 건다.
#     30000ms → 30초였던 것이 1000ms → **1초**가 된다(DriverDataSource 는 DriverManager 전역 static 에 반영).
#     그리고 풀 초기화는 fail-fast 다(HikariConfig.initializationFailTimeout=1 기본): 첫 물리 커넥션이
#     1초 안에 안 잡히면 PoolInitializationException → 컨텍스트 기동 실패 → 컨테이너 크래시루프 → 런 무효.
#     minIdle 은 미설정 시 maxPoolSize 와 같아지므로(HikariConfig:1083) DB_POOL_SIZE=30 × (orderapi 4 + userapi 2)
#     = 180 커넥션이 기동 직후 동시에 채워지고, healthcheck 의 `mysqladmin ping` 은 mysqld 워밍업 완료를
#     보장하지 않아 service_healthy 만으로는 완충되지 않는다. T2 복구 직후(크래시 리커버리)에도 같은 제한이 걸린다.
#     → up -d 직후 반드시 아래로 6개 앱 컨테이너의 정상 기동을 확인할 것 (README §실행 절차에도 넣었다):
#         docker compose -f docker-compose.qa.yml logs orderapi userapi \
#           | grep -i 'PoolInitializationException\|Exception during pool initialization\|Start completed'
#       크래시루프가 보이면 DB_CONN_TIMEOUT_MS=2000 으로 올린다 — 10 × 2000 = 20s < 21s 라 T2 재현 조건은
#       그대로 만족하면서 로그인 타임아웃만 2초로 완화된다.
#
#   ★ 가드: 카오스 없는 스모크(C-smoke/T-smoke)에서 v3a(PENDING/PAID 잔여)가 0 이 아니면
#     이 값이 너무 공격적이라는 신호다 — 평상시 부하만으로 커넥션 획득이 타임아웃해
#     T2 와 무관한 드롭을 만들고 있는 것이므로 값을 올려(2000 → 5000) 스모크 v3a=0 을 회복시킨 뒤
#     본 런을 돌린다.
#
#   ★ 양 arm 동일 적용 필수: control(v1) 과 treatment 는 같은 compose 를 써야 비교가 성립한다.
#     또 기존 런(C-run1~3 / T-run1~2 / T-noT4)은 이 설정 없이(=30000ms) 측정됐으므로 직접 비교 금지.
# -----------------------------------------------------------------------------
#
# 사용 (상세 절차는 README §실행 — 수동 측정):
#   export ORDERAPI_REPLICAS=4                                          # deploy.replicas 로 주입 (기본 4)
#   docker compose -f docker-compose.qa.yml up -d \
#       mysql-user mysql-order redis kafka eureka userapi orderapi gateway db-seed
#   docker compose -f docker-compose.qa.yml down -v
# =============================================================================

name: consist

services:
  mysql-user:
    image: mysql:8.0
    command: ["--max-connections=300"]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: user
      MYSQL_USER: commerce
      MYSQL_PASSWORD: commerce
    ports:
      - "3306:3306"
    volumes:
      - mysql-user-consist-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pcommerce"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [commerce-consist]

  mysql-order:
    image: mysql:8.0
    command: ["--max-connections=300"]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: orders
      MYSQL_USER: commerce
      MYSQL_PASSWORD: commerce
    ports:
      - "3307:3306"
    volumes:
      - mysql-order-consist-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pcommerce"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [commerce-consist]

  # ★ 볼륨 없음(ephemeral) — T3(멱등키 유실) 카오스 대상: FLUSHALL/restart 로 idem:order:* 소실.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [commerce-consist]

  # ★ 볼륨 없음(ephemeral) + 단일 브로커 RF1 — T4(로그 전소) 카오스 대상.
  #   KAFKA_CFG_NUM_PARTITIONS: 4 → 자동 생성 토픽이 4파티션 (기본 1 → ADR-008 ≥4 요구 충족).
  kafka:
    image: bitnamilegacy/kafka:3.7
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_NUM_PARTITIONS: "4"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [commerce-consist]

  eureka:
    build:
      context: ../..
      dockerfile: eurekaServer/Dockerfile
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8761/ > /dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    networks: [commerce-consist]

  userapi:
    build:
      context: ../..
      dockerfile: userApi/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: test
      MYSQL_HOST: mysql-user
      MYSQL_PORT: 3306
      MYSQL_DATABASE: user
      MYSQL_USER: commerce
      MYSQL_PASSWORD: commerce
      MAIL_USERNAME: dummy@example.com
      MAIL_PASSWORD: dummy-password
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_SERVER_URL: http://eureka:8761/eureka/
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${DB_POOL_SIZE:-30}
      # ★ 1000ms: DefaultErrorHandler 10회 × connectionTimeout(=재시도 창 10s) < DB 불가 시간(≈21s)
      #   이어야 T2 의 "10회 재시도 후 드롭"이 재현된다. 기본 30000ms 면 재시도 창 300s 라 첫 시도가
      #   DB 복구까지 그냥 대기했다 성공 → 예외 0 → 드롭 0 (실측 T-noT4 v3a=0).
      #   HikariCP 하한 250ms(미만은 기동 실패/30000 되돌림), 0 은 무한 대기이므로 금지.
      #   무카오스 스모크에서 v3a≠0 이면 값이 너무 공격적 → 상향(2000~5000). 상세는 파일 상단 주석.
      #   (T2 는 mysql-order 만 멈추지만 두 서비스에 대칭 적용 — DB_POOL_SIZE 와 같은 관례)
      #   ★ 부작용: JDBC 로그인 타임아웃도 함께 내려간다 — max(1, (500+ct)/1000)초 (PoolBase.setLoginTimeout).
      #     1000ms → 1초. 기동 시 풀 초기화가 fail-fast(initializationFailTimeout=1)라 첫 물리 커넥션이
      #     1초를 넘기면 PoolInitializationException 으로 컨테이너가 크래시루프에 빠진다. up -d 직후 로그 확인 필수.
      SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: ${DB_CONN_TIMEOUT_MS:-1000}
    depends_on:
      mysql-user: { condition: service_healthy }
      kafka: { condition: service_healthy }
      eureka: { condition: service_healthy }
    # ★ 예기치 못한 사망만 자가 복구시킨다 — 카오스는 건드리지 않는다.
    #   Docker 는 `docker stop` 뿐 아니라 `docker kill` 도 "수동 정지"로 표시하므로 restart 정책이 발동하지 않는다.
    #   → T1(kill 후 T1_DOWN_S 뒤 start) · T4(stop orderapi) · T2(stop mysql-order) 의 다운타임은 그대로 유지되고,
    #     기동 실패·OOM 등 의도치 않은 종료만 재시작된다. 이게 없으면 죽은 인스턴스가 Exited 로 남는데
    #     gateway·db-seed 의 depends_on: service_started 는 그대로 통과해, 인스턴스가 조용히 줄어든 채
    #     런이 진행되고 ②④ 발화 병렬도가 설계값과 달라진다(산출물에는 흔적이 남지 않는다).
    restart: unless-stopped
    # ★ 기동 실패를 조용히 넘기지 않기 위한 라이브니스 체크 — `up -d --wait` 로 인스턴스 수를 보장한다.
    #   ★ -f 를 쓰지 않는다: 확인 대상은 엔드포인트의 정상 동작이 아니라 "컨텍스트가 살아 있는가"다.
    #     Spring Boot 는 모든 싱글턴 초기화 후에 톰캣을 띄우므로(finishRefresh) 풀 초기화·Flyway 실패 시
    #     포트 자체가 열리지 않는다. 따라서 401/404 응답도 생존 증거로 충분하다.
    #   ★ actuator /health 를 쓰지 않는 이유: 기본 구성의 db·redis·kafka 인디케이터가
    #     T2/T3/T4 카오스 구간마다 DOWN 을 만들어 런 내내 unhealthy 로 뒤집힌다.
    healthcheck:
      test: ["CMD-SHELL", "curl -sS http://localhost:8080/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 90s          # Flyway + Eureka 등록까지의 여유. 이 구간의 실패는 retries 에 세지 않는다.
    deploy:
      # ★ SAGA 결제 컨슈머가 파이프라인 상한이다: 1인스턴스면 order-created 4파티션이 전부
      #   한 컨슈머에 배정돼 드레인이 ~29/s 에 묶이고(실측 lag 26k), 정착에 부하시간의 4배가 든다.
      #   2인스턴스 → 파티션 2개씩. 잔액 경합(⑤)도 단일 JVM 스레드 경합이 아니라 인스턴스 간
      #   경합이 되어 무방어 arm 의 lost update 가 실제 조건으로 발화한다.
      replicas: ${USERAPI_REPLICAS:-2}
      resources:
        limits:
          cpus: '2'
          memory: 1G
    networks: [commerce-consist]

  # 정합성 경합의 주 무대. deploy.replicas=${ORDERAPI_REPLICAS:-4} 로 4인스턴스 기동 (× 4파티션).
  orderapi:
    build:
      context: ../..
      dockerfile: orderApi/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: test
      MYSQL_HOST: mysql-order
      MYSQL_PORT: 3306
      MYSQL_DATABASE: orders
      MYSQL_USER: commerce
      MYSQL_PASSWORD: commerce
      REDIS_HOST: redis
      REDIS_PORT: 6379
      USER_API_URL: http://gateway/user/customer
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_SERVER_URL: http://eureka:8761/eureka/
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${DB_POOL_SIZE:-30}
      # ★ 1000ms: T2(mysql-order stop) 의 직접 대상. DefaultErrorHandler 10회 × connectionTimeout
      #   = 재시도 창 10s < 실제 DB 불가 시간(≈21s) → 재시도 소진 → log-and-commit 드롭 = T2 재현.
      #   30000ms(Hikari 기본)면 재시도 창 300s 라 StockConsumer 가 DB 복구까지 대기했다 성공해
      #   결함이 통째로 잠든다. f426df4 는 T2_DOWN_S 25→10s 로 오히려 그 상태를 만들었다.
      #   HikariCP 하한 250ms / 0 = 무한 대기 금지. 무카오스 스모크 v3a≠0 이면 상향할 것.
      #   ★ 부작용: JDBC 로그인 타임아웃 = max(1, (500+ct)/1000)초 로 함께 하향(1000ms → 1초).
      #     기동 시 fail-fast 풀 초기화(minIdle=maxPoolSize=30 를 4 replicas 가 동시에 채운다)와
      #     T2 복구 직후 mysqld 크래시 리커버리 구간에 같은 1초 제한이 걸린다. 크래시루프면 2000 으로 올릴 것
      #     (10 × 2000 = 20s < 21s 라 T2 재현 조건은 유지된다).
      SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: ${DB_CONN_TIMEOUT_MS:-1000}
    depends_on:
      mysql-order: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
      eureka: { condition: service_healthy }
    # ★ userapi 와 동일 (상세 근거는 userapi 쪽 주석).
    #   여기는 4 replicas 라 한 대만 죽어도 ② 재고 경합 병렬도가 4→3 으로 떨어진다 — 조용한 무효 런의 주 발생원.
    #   T1 이 `docker kill` 로 죽이는 대상이 바로 이 서비스지만, kill 은 수동 정지로 취급돼 재시작되지 않는다.
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sS http://localhost:8080/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 90s
    deploy:
      replicas: ${ORDERAPI_REPLICAS:-4}   # ADR-008 명세 4인스턴스. --scale 대신 env 주입 —
                                          # k6 를 별도 `docker compose run` 으로 부를 때 1 로 리셋되지 않는다.
      resources:
        limits:
          cpus: '2'
          memory: 1G
    networks: [commerce-consist]

  gateway:
    build:
      context: ../..
      dockerfile: gateway/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: test
      EUREKA_SERVER_URL: http://eureka:8761/eureka/
    ports:
      - "8080:80"
    depends_on:
      eureka: { condition: service_healthy }
      userapi: { condition: service_started }
      orderapi: { condition: service_started }
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 768M
    networks: [commerce-consist]

  # 시나리오 자립 시드(seller1 + ctrich + hot/normal SKU) 자동 주입 (1회용).
  #   스키마는 Flyway(앱 부팅 시)가 만들므로 테이블이 생길 때까지 폴링 후 user.sql → order.sql 순으로
  #   주입한다 (product 가 seller 를 참조). 수동 측정 절차도 up 서비스 목록에 db-seed 를 포함해
  #   자동 주입하고 `docker compose wait db-seed` 로 완료를 기다린다.
  db-seed:
    image: mysql:8.0
    restart: "no"
    depends_on:
      mysql-user: { condition: service_healthy }
      mysql-order: { condition: service_healthy }
      userapi: { condition: service_started }
      orderapi: { condition: service_started }
    volumes:
      - ./seed:/seed:ro
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        echo "[db-seed] waiting for Flyway-created tables ..."
        until mysql -h mysql-user  -uroot -proot user   -e 'SELECT 1 FROM outbox_events LIMIT 1' >/dev/null 2>&1; do sleep 3; done
        until mysql -h mysql-order -uroot -proot orders -e 'SELECT 1 FROM outbox_events LIMIT 1' >/dev/null 2>&1; do sleep 3; done
        echo "[db-seed] consistency scenario (seller1 + ctrich + hot/normal SKU) ..."
        mysql -h mysql-user  -uroot -proot user   < /seed/user.sql
        mysql -h mysql-order -uroot -proot orders < /seed/order.sql
        echo "[db-seed] done."
    networks: [commerce-consist]

  # k6 부하 발생기 — 수동 측정 절차에서 run 마다 직접 호출한다 (ORDERAPI_REPLICAS export 유지):
  #   RUN_LABEL=T-run1 ORDER_TARGET=100000 ARRIVAL_RATE=200 \
  #       docker compose -f docker-compose.qa.yml run --rm --entrypoint sh k6
  k6:
    image: grafana/k6:0.51.0
    volumes:
      - ./k6:/scripts:ro
      - ./results:/results
    environment:
      GATEWAY_URL: http://gateway
      ORDER_TARGET: ${ORDER_TARGET:-100000}
      ARRIVAL_RATE: ${ARRIVAL_RATE:-200}
      RICH_POOL: ${RICH_POOL:-300}
      RUN_LABEL: ${RUN_LABEL:-unknown}
    depends_on:
      gateway: { condition: service_started }
    networks: [commerce-consist]

networks:
  commerce-consist:
    driver: bridge

volumes:
  mysql-user-consist-data:
  mysql-order-consist-data:

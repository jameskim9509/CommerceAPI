# =============================================================================
# ADR-008 control(무방어) 오버레이 — treatment(docker-compose.qa.yml) 위에 얹어
# orderapi/userapi 를 "6종 방어를 전부 제거한" :control 이미지로 교체한다.
#
#   6종(①②③④⑤⑥)은 모두 control/build-control-images.sh 의 소스 오버레이로 제거된다.
#   → 운영 이미지엔 방어를 끄는 스위치(토글/프로퍼티)가 없다(footgun 없음). env 토글도 없음 — 이미지 자체가 무방어.
#
# ★ 반드시 --no-build 로 기동한다. --no-build 없이 build 하면 orderapi/userapi 를 현재(방어 ON) 소스로
#   다시 빌드해 :control 태그를 덮어써 무방어 빌드가 오염된다 (run-consistency.sh control 은 --no-build 사용).
#
# 사용: docker compose -f docker-compose.qa.yml -f docker-compose.control.yml up -d --no-build --scale orderapi=4
# =============================================================================

services:
  orderapi:
    image: commerce-orderapi:control    # ①(멱등)·②(재고락)·⑥(dedup) 제거본

  userapi:
    image: commerce-userapi:control     # ③(환불)·④(잔액검증)·⑤(잔액락)·⑥(dedup) 제거본

server:
  port: 8080

spring:
  application:
    name: order-api
  datasource:
    url: jdbc:mysql://commerce-mysql.c90qy2aumeaj.ap-northeast-2.rds.amazonaws.com:3306/orders
    username: commerce
    password: commerce

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
#        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  redis:
    host: commerceredis-ro.scxzeb.ng.0001.apn2.cache.amazonaws.com
    port: 6379

  # ADR-003: Choreography SAGA — Kafka producer/consumer
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: orderapi-saga
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

user-api:
  url: http://ec2-43-202-0-143.ap-northeast-2.compute.amazonaws.com/user/customer

# ADR-008 정합성 통합 시나리오: 방어 on/off 토글 (기본 true = 방어 ON = 현재/treatment 동작).
#   control(무방어) 측정 시 docker-compose.control.yml 이 env(CONSISTENCY_DEFENSE_*)로 false override.
#   ②재고락·⑤잔액락(@Version)은 프로퍼티로 못 꺼서 control/build-control-images.sh 소스 오버레이가 담당(여기 없음).
consistency:
  defense:
    idempotency: true   # ① 멱등 게이트 (IdempotencyService)
    dedup: true         # ⑥ processed_events dedup (IdempotentEventHandler)

# ADR-005: Eureka 클라이언트 등록
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    # 다인스턴스에서 인스턴스별 고유 식별자 (host 가 같아도 구분되도록)
    instance-id: ${spring.application.name}:${spring.cloud.client.hostname:${HOSTNAME:localhost}}:${server.port}